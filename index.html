<style>
:root{
  --bg:#F2F0F8; --surface:#FFFFFF; --ink:#23203A; --muted:#6B6785; --line:#DEDAEB;
  --ribbon:#D93A55; --ribbon-ink:#FFFFFF; --mint:#2E7D6B; --mint-soft:#DDF0EA; --tag:#F5C451;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17152A; --surface:#221F38; --ink:#EEEBFA; --muted:#A39FBF; --line:#37334F;
    --ribbon:#F0607A; --ribbon-ink:#1A1020; --mint:#6FCBB3; --mint-soft:#1E3A34; --tag:#E8B83E;
  }
}
:root[data-theme="dark"]{
  --bg:#17152A; --surface:#221F38; --ink:#EEEBFA; --muted:#A39FBF; --line:#37334F;
  --ribbon:#F0607A; --ribbon-ink:#1A1020; --mint:#6FCBB3; --mint-soft:#1E3A34; --tag:#E8B83E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-family:"Unbounded","Golos Text",system-ui,sans-serif;font-weight:700;font-size:clamp(28px,8vw,40px);line-height:1.05;margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ribbon);outline-offset:2px}

/* people strip */
.people{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px;margin:0 -2px 8px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.person{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;width:68px}
.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--surface);border:2px solid var(--line);transition:transform .15s}
.person[aria-pressed="true"] .avatar{border-color:var(--ribbon);box-shadow:0 0 0 3px color-mix(in srgb,var(--ribbon) 25%,transparent)}
.person span{font-size:13px;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.person[aria-pressed="true"] span{color:var(--ink);font-weight:600}

/* the tag: the one memorable element */
.tag{position:relative;background:var(--surface);border-radius:6px 22px 22px 6px;padding:22px 20px 20px 40px;margin-bottom:18px;border:1px solid var(--line)}
.tag::before{content:"";position:absolute;left:14px;top:28px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.tag::after{content:"";position:absolute;left:-1px;top:0;bottom:0;width:6px;background:var(--ribbon);border-radius:6px 0 0 6px}
.tag h2{font-family:"Unbounded","Golos Text",system-ui,sans-serif;font-size:20px;font-weight:500;margin:0;line-height:1.2}
.tag .count{color:var(--muted);font-size:14px;margin-top:4px}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.item.claimed{background:var(--mint-soft);border-color:transparent}
.item-top{display:flex;gap:12px;align-items:flex-start}
.item-title{font-weight:600;flex:1;min-width:0;word-wrap:break-word}
.price{white-space:nowrap;font-weight:600;color:var(--muted)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:14px;color:var(--muted)}
.occ{background:var(--tag);color:#3A2A00;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:600}
.note{margin:8px 0 0;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.item a{color:var(--mint);font-weight:500;word-break:break-all}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;font-size:15px;background:var(--ribbon);color:var(--ribbon-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.mint{background:var(--mint);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.taken{font-size:14px;color:var(--muted);margin-top:10px}

.form{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:16px;margin-bottom:14px;display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.form input,.form textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
.form textarea{min-height:60px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.emojis{display:flex;gap:6px;flex-wrap:wrap}
.emojis button{font-size:24px;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.emojis button[aria-pressed="true"]{border:2px solid var(--ribbon)}
.empty{color:var(--muted);text-align:center;padding:28px 12px;font-size:15px}
.status{color:var(--muted);text-align:center;padding:40px 12px}
.hint{font-size:13px;color:var(--muted);margin:16px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const LANGS=[["uk","UA"],["de","DE"]];
let lang=(()=>{ try{ const s=localStorage.getItem("lang"); if(I18N[s]) return s; }catch{} return /^de/i.test(navigator.language||"")?"de":"uk"; })();
const t=(k,...a)=>{ const v=I18N[lang][k]; return typeof v==="function"?v(...a):v; };
function applyLang(){
  document.documentElement.lang=lang;
  const sw=document.getElementById("lang");
  if(sw) sw.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
}
function setLang(l, persist=true){
  if(!I18N[l]) return;
  const changed=l!==lang; lang=l;
  try{ localStorage.setItem("lang",l); }catch{}
  applyLang();
  if(persist&&me&&profiles[me]&&profiles[me].lang!==l) setDoc(doc(db,"profiles",me),{lang:l},{merge:true}).catch(e=>console.warn(e));
  if(changed) render();
}
(function buildSwitcher(){
  const sw=el("div",{id:"lang",class:"lang",role:"group","aria-label":"Мова / Sprache"});
  LANGS.forEach(([code,label])=>sw.append(el("button",{type:"button","data-lang":code,onclick:()=>setLang(code)},label)));
  document.querySelector(".topbar").append(sw);
  applyLang();
})();

  if(j) sessionStorage.setItem("pendingJoin",j);   // keep it in the URL until sign-in so "open in browser" keeps it
  pendingJoin=j||sessionStorage.getItem("pendingJoin");
}catch{ pendingJoin=new URLSearchParams(location.search).get("join"); }
function clearJoin(){
  pendingJoin=null;
  try{ sessionStorage.removeItem("pendingJoin"); }catch{}
  if(location.search.includes("join=")) history.replaceState(null,"",location.pathname);
}
function newCode(){ const a=new Uint8Array(12); crypto.getRandomValues(a); return [...a].map(b=>b.toString(36).padStart(2,"0")).join("").slice(0,20); }
function inviteLink(g){ return location.origin+location.pathname+"?join="+g.id+"."+g.inviteCode; }

async function doJoin(){
  const [gid,code]=String(pendingJoin).split(".");
  clearJoin();
  if(!gid||!code){ toast(t("inviteBroken")); return; }
  const gref=doc(db,"groups",gid);
  try{ const s=await getDoc(gref); if(s.exists()&&(s.data().emails||[]).includes(me)){ activeGroup=gid; return; } }catch{} // not a member yet — read is denied
  try{ await updateDoc(gref,{emails:arrayUnion(me),joinCode:code}); activeGroup=gid; view="lists"; toast(t("joined")); }
  catch(e){ console.error(e); joinError=(e&&e.code)||"error"; toast(t("joinToast")); }
}

/* ---------- helpers ---------- */
function el(tag, attrs={}, ...kids){
  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false) continue;
    if(k==="class") n.className=v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v===true?"":v);
  }
  for(const k of kids.flat()){ if(k==null||k===false) continue; n.append(k.nodeType?k:document.createTextNode(String(k))); }
  return n;
}
const norm = e => (e||"").trim().toLowerCase();
function displayName(e){ return (profiles[e]&&profiles[e].name) || (e===me?googleName:"") || e.split("@")[0]; }
function safeUrl(u){ try{ const x=new URL(u); return /^https?:$/.test(x.protocol)?x.href:null; }catch{ return null; } }
const plural=n=>t("plural",n);
function toast(t){ const n=el("div",{class:"toast",role:"status"},t); document.body.append(n); setTimeout(()=>n.remove(),2600); }
const myGroups=()=>groups.filter(g=>(g.emails||[]).includes(me));

async function write(fn, okMsg){
  if(busy) return; busy=true;
  try{ await fn(); if(okMsg) toast(okMsg); }
  catch(e){
    console.error(e);
    if(e&&e.code==="permission-denied") toast(t("noRights"));
    else toast(t("saveFailed"));
  }
  finally{ busy=false; render(); }
}

/* ---------- subscriptions ---------- */
function wanted(){
  const w=new Set(["p:"+me]);
  for(const g of myGroups()) for(const e of g.emails||[]){
    w.add("p:"+e); w.add("i:"+g.id+":"+e);
    if(e!==me) w.add("c:"+g.id+":"+e);
  }
  return w;
}
function syncSubs(){
  const w=wanted();
  for(const [k,u] of subs) if(!w.has(k)){ u(); subs.delete(k); }
  for(const k of w) if(!subs.has(k)) start(k);
}
function start(k){
  const [t,a,b]=k.split(":");
  const fail=err=>{
    console.warn(k,err&&err.code); subs.delete(k);
    if(t==="p"&&a===me){ loadedProfile=true; }
    if(t==="i") failed[key(a,b)]=true;
    render();
    retries[k]=(retries[k]||0)+1;
    if(retries[k]<=3) setTimeout(syncSubs,2500*retries[k]);
  };
  let u;
  if(t==="p") u=onSnapshot(doc(db,"profiles",a), s=>{
    profiles[a]=s.exists()?s.data():null;
    if(a===me){
      loadedProfile=true;
      const pl=profiles[a]&&profiles[a].lang;
      if(pl&&I18N[pl]&&pl!==lang) setLang(pl,false);                 // remembered language for this person
      else if(profiles[a]&&!pl) setDoc(doc(db,"profiles",me),{lang},{merge:true}).catch(()=>{});
    }
    render(); }, fail);
  else if(t==="i") u=onSnapshot(query(itemsCol(b,a),orderBy("createdAt","asc")), s=>{ items[key(a,b)]=s.docs.map(d=>({id:d.id,...d.data()})); delete failed[key(a,b)]; delete retries[k]; render(); }, fail);
  else if(t==="c") u=onSnapshot(claimsCol(b,a), s=>{ const m={}; s.docs.forEach(d=>m[d.id]=d.data()); claims[key(a,b)]=m; render(); }, fail);
  if(u) subs.set(k,u);
}
function unsubAll(){ subs.forEach(u=>u()); subs.clear(); if(groupsUnsub){groupsUnsub();groupsUnsub=null;} }

/* ---------- render ---------- */
function render(){
  const keep={}; app.querySelectorAll("form[data-key] input[name][data-dirty],form[data-key] textarea[name][data-dirty]").forEach(n=>keep[n.form.dataset.key+"|"+n.name]=n.value);
  const focused=document.activeElement&&document.activeElement.name;
  app.replaceChildren();
  queueMicrotask(()=>{ app.querySelectorAll("form[data-key] input[name],form[data-key] textarea[name]").forEach(n=>{ const k=n.form.dataset.key+"|"+n.name; if(k in keep){ n.value=keep[k]; n.dataset.dirty="1"; } if(n.name===focused) n.focus(); }); });

  if(!me){ app.append(loginView()); return; }
  if(!loadedGroups||!loadedProfile){ app.append(el("p",{class:"status"},t("loadingLists"))); return; }

  app.append(el("div",{class:"me"}, el("span",{},me), el("button",{class:"linkbtn",onclick:()=>signOut(auth)},t("logout"))));
  if(!profiles[me]){ app.append(profileForm()); return; }

  const mg=myGroups();
  if(mg.length||isAdmin){
    if(!activeGroup||!mg.find(g=>g.id===activeGroup)) activeGroup=mg[0]?mg[0].id:null;
    const bar=el("div",{class:"groups",role:"group","aria-label":t("peopleLists")});
    mg.forEach(g=>bar.append(el("button",{class:"chip","aria-pressed":String(view==="lists"&&g.id===activeGroup),onclick:()=>{view="lists";activeGroup=g.id;selected=null;adding=false;editing=null;filter="all";render();}},g.name)));
    if(isAdmin) bar.append(el("button",{class:"chip admin","aria-pressed":String(view==="admin"),onclick:()=>{view="admin";render();}},t("manage")));
    app.append(bar);
  }
  if(view==="admin"&&isAdmin){ app.append(adminView()); return; }

  const g=mg.find(x=>x.id===activeGroup);
  if(!g){
    if(joinError) app.append(el("div",{class:"notice",style:"border-left-color:var(--ribbon)"},t("joinError",joinError)));
    app.append(el("div",{class:"notice"},
      isAdmin? t("adminNoGroups") : t("userNoGroups",me)));
    return;
  }

  const ids=[me,...(g.emails||[]).filter(e=>e!==me)];
  if(!selected||!ids.includes(selected)) selected=me;

  const strip=el("div",{class:"people",role:"group","aria-label":t("whose")});
  for(const id of ids){
    const ghost=id!==me&&!profiles[id];
    strip.append(el("button",{class:"person"+(ghost?" ghost":""),"aria-pressed":String(id===selected),title:id,onclick:()=>{selected=id;filter="all";adding=false;editing=null;render();}},
      el("div",{class:"avatar"},(profiles[id]&&profiles[id].emoji)||"🎁"),
      el("span",{},id===me?t("meShort"):displayName(id))));
  }
  app.append(strip);

  const mine=selected===me;
  const k=key(g.id,selected);
  const list=items[k]||[];
  app.append(el("div",{class:"tag"},
    el("h2",{},mine?t("myWishlist"):t("wishlistOf",displayName(selected))),
    el("div",{class:"count"}, !mine&&!profiles[selected]?t("notJoined"): list.length?`${list.length} ${plural(list.length)}`:t("empty"))));

  if(mine) app.append(el("p",{class:"hint",style:"margin:0 0 12px"},t("visibleTo",g.name)));

  if(failed[k]&&!items[k]){ app.append(el("p",{class:"empty"},t("loadFailed"))); return; }

  if(mine){
    if(adding) app.append(itemForm(null,g));
    else app.append(el("button",{class:"btn",style:"width:100%;margin-bottom:14px",onclick:()=>{adding=true;editing=null;render();queueMicrotask(()=>{const i=app.querySelector("form input");if(i)i.focus();});}},t("addWish")));
  }

  const occs=[...new Set(list.map(i=>i.occasion).filter(Boolean))];
  if(filter!=="all"&&!occs.includes(filter)) filter="all";
  if(occs.length>1){
    const c=el("div",{class:"chips"});
    for(const o of ["all",...occs]) c.append(el("button",{class:"chip","aria-pressed":String(filter===o),onclick:()=>{filter=o;render();}},o==="all"?t("all"):o));
    app.append(c);
  }
  const shown=list.filter(i=>filter==="all"||i.occasion===filter);
  if(!shown.length){
    app.append(el("p",{class:"empty"}, mine?t("emptyMine"):t("emptyOther")));
  } else {
    const ul=el("ul",{class:"items"});
    for(const it of shown) ul.append(editing===it.id?el("li",{},itemForm(it,g)):itemCard(it,mine,g));
    app.append(ul);
  }
  if(mine&&list.length) app.append(el("p",{class:"hint"},t("surprise")));
}

/* In-app browsers (Telegram, Instagram, Facebook, WhatsApp…) are blocked by Google sign-in */
const UA=navigator.userAgent||"";
const isIOS=/iPhone|iPad|iPod/.test(UA)||(/Macintosh/.test(UA)&&navigator.maxTouchPoints>1);
const isAndroid=/Android/.test(UA);
const inApp=!!window.TelegramWebviewProxy||/Telegram|FBAN|FBAV|FB_IAB|Instagram|Line\/|WhatsApp|; wv\)/i.test(UA);
function siteUrl(){ return location.origin+location.pathname+(pendingJoin?"?join="+encodeURIComponent(pendingJoin):""); }
function openOutside(){
  const url=siteUrl();
  if(isAndroid){
    const u=new URL(url);
    location.href="intent://"+u.host+u.pathname+u.search+"#Intent;scheme=https;S.browser_fallback_url="+encodeURIComponent(url)+";end";
  } else if(isIOS){
    location.href="x-safari-"+url;
  }
}
async function copySite(){
  const url=siteUrl();
  try{ await navigator.clipboard.writeText(url); toast(t("copiedOpen")); }
  catch{ prompt(t("copyPrompt"),url); }
}

function loginView(){
  const google=async()=>{
    const p=new GoogleAuthProvider();
    try{ await signInWithPopup(auth,p); }
    catch(e){ if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")) signInWithRedirect(auth,p); else if(e&&e.code!=="auth/popup-closed-by-user") toast(t("loginFailed")); }
  };
  const invite=pendingJoin? el("div",{class:"notice",style:"text-align:left"},t("invited")) : null;

  if(inApp){
    return el("div",{class:"login"},
      invite,
      el("div",{class:"notice",style:"text-align:left"},
        el("strong",{},t("openNormal")),
        el("p",{style:"margin:6px 0 0"},t("inAppWhy")),
        el("p",{style:"margin:6px 0 0"}, isIOS? t("iosHow") : isAndroid? t("androidHow") : t("otherHow"))),
      (isIOS||isAndroid)? el("button",{class:"btn",style:"width:100%;margin-bottom:10px",onclick:openOutside}, isIOS?t("openSafari"):t("openBrowser")) : null,
      el("button",{class:"btn mint",style:"width:100%;margin-bottom:10px",onclick:copySite},t("copyLink")),
      el("button",{class:"linkbtn",onclick:google},t("tryHere")));
  }

  return el("div",{class:"login"},
    invite,
    el("p",{class:"sub"},t("tagline")),
    el("button",{class:"btn",onclick:google},t("signIn")));
}

function itemCard(it,mine,g){
  const owner=selected;
  const cl=claims[key(g.id,owner)]||{};
  const claim=!mine&&cl[it.id];
  const byMe=claim&&claim.by===me;
  const li=el("li",{class:"item"+(claim?" claimed":"")});
  li.append(el("div",{class:"item-top"},el("div",{class:"item-title"},it.title),it.price?el("div",{class:"price"},it.price):null));
  const url=safeUrl(it.url||"");
  const meta=el("div",{class:"meta"});
  if(it.occasion) meta.append(el("span",{class:"occ"},it.occasion));
  if(url) meta.append(el("a",{href:url,target:"_blank",rel:"noopener noreferrer"},t("link")));
  if(meta.childNodes.length) li.append(meta);
  if(it.note) li.append(el("p",{class:"note"},it.note));

  if(mine){
    li.append(el("div",{class:"actions"},
      el("button",{class:"btn ghost",onclick:()=>{editing=it.id;adding=false;render();}},t("edit")),
      el("button",{class:"btn ghost",onclick:()=>{ if(confirm(t("confirmDelete",it.title))) write(()=>deleteDoc(itemDoc(me,g.id,it.id))); }},t("del"))));
  } else if(byMe){
    li.append(el("div",{class:"taken"},t("youGive")));
    li.append(el("div",{class:"actions"},el("button",{class:"btn ghost",onclick:()=>write(()=>deleteDoc(claimDoc(owner,g.id,it.id)))},t("cancelClaim"))));
  } else if(claim){
    li.append(el("div",{class:"taken"},t("takenBy",displayName(claim.by))));
  } else {
    li.append(el("div",{class:"actions"},el("button",{class:"btn mint",onclick:()=>write(()=>setDoc(claimDoc(owner,g.id,it.id),{by:me,at:Date.now()}))},t("iGive"))));
  }
  return li;
}

function itemForm(it,g){
  const f=el("form",{class:"form","data-key":it?it.id:"new",onsubmit:e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(f));
    const title=(d.title||"").trim(); if(!title) return;
    const body={title:title.slice(0,200),url:(d.url||"").trim().slice(0,1000),price:(d.price||"").trim().slice(0,40),occasion:(d.occasion||"").trim().slice(0,40),note:(d.note||"").trim().slice(0,1000)};
    write(async()=>{
      if(it) await updateDoc(itemDoc(me,g.id,it.id),body);
      else await addDoc(itemsCol(me,g.id),{...body,createdAt:Date.now()});
      adding=false; editing=null;
    });
  }});
  const v=k=>it?(it[k]||""):"";
  f.append(
    el("label",{},t("fTitle"),el("input",{name:"title",required:true,maxlength:"200",value:v("title"),placeholder:t("fTitlePh")})),
    el("label",{},t("fUrl"),el("input",{name:"url",type:"url",inputmode:"url",value:v("url"),placeholder:"https://…"})),
    el("div",{class:"row"},
      el("label",{},t("fPrice"),el("input",{name:"price",maxlength:"40",value:v("price"),placeholder:"≈ 40 €"})),
      el("label",{},t("fOcc"),el("input",{name:"occasion",list:"occ-list",maxlength:"40",value:v("occasion"),placeholder:t("occasions")[0]}))),
    el("datalist",{id:"occ-list"},t("occasions").map(o=>el("option",{value:o}))),
    el("label",{},t("fNote"),el("textarea",{name:"note",maxlength:"1000",placeholder:t("fNotePh")},v("note"))),
    el("div",{class:"actions"},
      el("button",{class:"btn",type:"submit",disabled:busy},it?t("save"):t("addTo",g.name)),
      el("button",{class:"btn ghost",type:"button",onclick:()=>{adding=false;editing=null;render();}},t("cancel"))));
  return f;
}

function profileForm(){
  const f=el("form",{class:"form","data-key":"profile",onsubmit:e=>{
    e.preventDefault();
    const name=new FormData(f).get("name").trim(); if(!name) return;
    write(()=>setDoc(doc(db,"profiles",me),{name:name.slice(0,40),emoji:joinEmoji,lang}));
  }});
  const em=el("div",{class:"emojis",role:"group","aria-label":t("avatar")});
  for(const e of EMOJIS) em.append(el("button",{type:"button","aria-pressed":String(e===joinEmoji),"aria-label":e,onclick:()=>{joinEmoji=e;em.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.textContent===e)));}},e));
  f.append(
    el("strong",{},t("howSign")),
    el("label",{},t("nameLabel"),el("input",{name:"name",required:true,maxlength:"40",value:googleName,placeholder:t("namePh")})),
    em,
    el("div",{class:"actions"},el("button",{class:"btn",type:"submit"},t("cont"))));
  return f;
}

function adminView(){
  const wrap=el("div",{});
  const create=el("form",{class:"form","data-key":"newgroup",onsubmit:e=>{
    e.preventDefault();
    const name=new FormData(create).get("gname").trim(); if(!name) return;
    write(async()=>{ const r=await addDoc(collection(db,"groups"),{name:name.slice(0,40),emails:[me],inviteCode:newCode(),createdAt:Date.now()}); activeGroup=r.id; create.reset(); },t("groupCreated"));
  }},
    el("strong",{},t("newGroup")),
    el("label",{},t("gName"),el("input",{name:"gname",required:true,maxlength:"40",placeholder:t("gNamePh")})),
    el("div",{class:"actions"},el("button",{class:"btn",type:"submit"},t("create"))));
  wrap.append(create);

  groups.forEach(g=>{
    const f=el("form",{class:"form group-card","data-key":"g-"+g.id,onsubmit:e=>{
      e.preventDefault();
      const d=Object.fromEntries(new FormData(f));
      const emails=[...new Set(String(d.emails||"").split(/[\s,;]+/).map(norm).filter(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x)))];
      write(async()=>{ await updateDoc(doc(db,"groups",g.id),{name:(d.gname||g.name).trim().slice(0,40),emails}); f.querySelectorAll("[data-dirty]").forEach(n=>delete n.dataset.dirty); },t("saved"));
    }},
      el("h3",{},g.name),
      g.inviteCode
        ? el("div",{class:"actions",style:"margin-top:0"},
            el("button",{class:"btn mint",type:"button",onclick:async()=>{ const l=inviteLink(g); try{ await navigator.clipboard.writeText(l); toast(t("linkCopied")); }catch{ prompt(t("copyLinkPrompt"),l); } }},t("copyInvite")),
            el("button",{class:"btn ghost",type:"button",onclick:()=>{ if(confirm(t("confirmNewLink"))) write(()=>updateDoc(doc(db,"groups",g.id),{inviteCode:newCode()}),t("newLinkReady")); }},t("newLink")))
        : el("div",{class:"actions",style:"margin-top:0"},
            el("button",{class:"btn mint",type:"button",onclick:()=>write(()=>updateDoc(doc(db,"groups",g.id),{inviteCode:newCode()}),t("linkCreated"))},t("createInvite"))),
      el("label",{},t("gName"),el("input",{name:"gname",maxlength:"40",value:g.name})),
      el("label",{},t("emailsLabel"),el("textarea",{name:"emails",rows:"5",placeholder:"mama@gmail.com\nsasha@gmail.com"},(g.emails||[]).join("\n"))),
      el("div",{class:"pending"},t("members",(g.emails||[]).length)),
      el("div",{class:"actions"},
        el("button",{class:"btn",type:"submit"},t("save")),
        el("button",{class:"btn ghost",type:"button",onclick:()=>{ if(confirm(t("confirmDelGroup",g.name))) write(()=>deleteDoc(doc(db,"groups",g.id)),t("deleted")); }},t("del"))));
    wrap.append(f);
  });
  return wrap;
}

/* ---------- auth ---------- */
app.addEventListener("input",e=>{ if(e.target&&e.target.name) e.target.dataset.dirty="1"; });

onAuthStateChanged(auth, async u=>{
  unsubAll();
  profiles={}; items={}; claims={}; failed={}; groups=[]; selected=null; view="lists";
  loadedGroups=false; loadedProfile=false;
  if(!u||!u.email){ me=null; render(); return; }
  me=norm(u.email); googleName=u.displayName||""; isAdmin=me===norm(ADMIN_EMAIL);
  if(pendingJoin){ app.replaceChildren(el("p",{class:"status"},t("joining"))); await doJoin(); }
  const q=isAdmin? query(collection(db,"groups"),orderBy("createdAt","asc"))
                 : query(collection(db,"groups"),where("emails","array-contains",me));
  groupsUnsub=onSnapshot(q, s=>{
    groups=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    loadedGroups=true; syncSubs(); render();
  }, err=>{ console.error(err); toast(t("groupsLoadFailed")); loadedGroups=true; syncSubs(); render(); });
  syncSubs();
  render();
});
</script>
